<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PaperTrail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .navbar { background: #2c3e50 !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">📚 PaperTrail</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4">📦 Checkout</h2>
    
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h5>Order Summary</h5>
                    <div id="checkoutItems"></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>Total Amount</h5>
                    <h3 class="text-success">₹<span id="checkoutTotal">0</span></h3>
                    <button class="btn btn-primary w-100 mt-3" onclick="proceedToPayment()">Proceed to Payment</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadCheckoutPage);
</script>
</body>
</html>
