<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details - PaperTrail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f5f5f5; }
        .navbar { background: #2c3e50 !important; }
        .book-detail { background: white; border-radius: 20px; padding: 30px; margin-top: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .book-image { width: 100%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .price { font-size: 2.5rem; color: #28a745; font-weight: bold; }
        .btn-buy { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; }
        .btn-cart { background: linear-gradient(135deg, #28a745, #20c997); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; }
        .btn-wishlist { background: white; border: 2px solid #dc3545; color: #dc3545; padding: 12px; border-radius: 50%; width: 50px; height: 50px; }
        .quantity-selector { display: flex; align-items: center; gap: 15px; margin: 20px 0; }
        .qty-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ddd; background: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">📚 PaperTrail</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist</a></li>
                <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" id="bookDetailContainer">
    <div class="text-center py-5">Loading...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
    const API_URL = 'http://localhost:5000/api';
    let currentBook = null;
    let quantity = 1;

    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    async function loadBookDetails() {
        try {
            const res = await fetch(`${API_URL}/books/${bookId}`);
            currentBook = await res.json();
            displayBook();
        } catch(e) { document.getElementById('bookDetailContainer').innerHTML = '<div class="text-center text-danger">Book not found</div>'; }
    }

    function displayBook() {
        const imgUrl = currentBook.imageUrl || 'https://covers.openlibrary.org/b/id/8222591-L.jpg';
        document.getElementById('bookDetailContainer').innerHTML = `
            <div class="row">
                <div class="col-md-5">
                    <img src="${imgUrl}" class="book-image" onerror="this.src='https://covers.openlibrary.org/b/id/8222591-L.jpg'">
                </div>
                <div class="col-md-7">
                    <div class="book-detail">
                        <h1>${currentBook.title}</h1>
                        <h4 class="text-muted">by ${currentBook.author}</h4>
                        <div class="mt-2"><span class="badge bg-success">In Stock</span> <span class="badge bg-info">Free Shipping</span></div>
                        <div class="price mt-3">₹${currentBook.price}</div>
                        <p class="mt-3 text-muted">${currentBook.description || 'No description available.'}</p>
                        
                        <div class="quantity-selector">
                            <button class="qty-btn" onclick="changeQty(-1)">-</button>
                            <span class="fs-3" id="qty">1</span>
                            <button class="qty-btn" onclick="changeQty(1)">+</button>
                        </div>
                        
                        <div class="d-flex gap-3 mt-4">
                            <button class="btn-buy" onclick="buyNow()"><i class="fas fa-bolt me-2"></i>Buy Now</button>
                            <button class="btn-cart" onclick="addToCartDetail()"><i class="fas fa-cart-plus me-2"></i>Add to Cart</button>
                            <button class="btn-wishlist" onclick="addToWishlistFromDetail()"><i class="fas fa-heart"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function changeQty(delta) { quantity += delta; if (quantity < 1) quantity = 1; if (quantity > 10) quantity = 10; document.getElementById('qty').innerText = quantity; }

    function addToCartDetail() {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existing = cart.find(item => item.id === currentBook._id);
        if (existing) existing.quantity += quantity;
        else cart.push({ id: currentBook._id, title: currentBook.title, price: currentBook.price, quantity: quantity });
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        showToast(`${quantity} × ${currentBook.title} added to cart!`, 'success');
    }

    function buyNow() { addToCartDetail(); setTimeout(() => { window.location.href = 'checkout.html'; }, 1000); }
    
    function addToWishlistFromDetail() {
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
        if (!wishlist.find(w => w.id === currentBook._id)) {
            wishlist.push({ id: currentBook._id, title: currentBook.title, author: currentBook.author, price: currentBook.price, image: currentBook.imageUrl });
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            updateWishlistCount();
            showToast(`${currentBook.title} added to wishlist!`, 'success');
        } else { showToast('Already in wishlist!', 'error'); }
    }

    loadBookDetails();
</script>
</body>
</html>
