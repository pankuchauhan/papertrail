<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - PaperTrail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f5f5f5; }
        .navbar { background: #2c3e50 !important; }
        .cart-item { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">📚 PaperTrail</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4">🛒 Your Cart</h2>
    <div id="cartItems"></div>
    
    <div class="row mt-4">
        <div class="col-md-6 offset-md-6">
            <div class="card">
                <div class="card-body">
                    <h4>Total: ₹<span id="cartTotal">0</span></h4>
                    <button class="btn btn-success w-100 mt-3" onclick="checkout()">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadCartPage);
</script>
</body>
</html>
