<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - PaperTrail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; }
        .payment-card { background: white; border-radius: 20px; padding: 30px; max-width: 500px; margin: 50px auto; }
        .payment-option { border: 2px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 15px; cursor: pointer; }
        .payment-option:hover { border-color: #28a745; background: #f0fff0; }
        .total-amount { font-size: 2rem; color: #28a745; font-weight: bold; }
        .btn-pay { background: #28a745; color: white; border: none; padding: 15px; border-radius: 50px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="payment-card">
        <h2 class="text-center mb-4"><i class="fas fa-credit-card me-2"></i>Payment</h2>
        
        <div class="text-center mb-4">
            <h5>Total Amount</h5>
            <div class="total-amount">₹<span id="paymentTotal">0</span></div>
        </div>
        
        <div id="paymentSection">
            <h5>Select Payment Method</h5>
            <div class="payment-option" onclick="selectPaymentMethod('cod')">
                <i class="fas fa-truck fa-2x text-success me-3"></i>
                <strong>Cash on Delivery</strong>
                <p class="mb-0 text-muted">Pay when you receive order</p>
            </div>
            <div class="payment-option" onclick="selectPaymentMethod('card')">
                <i class="fas fa-credit-card fa-2x text-primary me-3"></i>
                <strong>Credit/Debit Card</strong>
            </div>
            <div class="payment-option" onclick="selectPaymentMethod('upi')">
                <i class="fas fa-mobile-alt fa-2x text-info me-3"></i>
                <strong>UPI (Google Pay, PhonePe)</strong>
            </div>
        </div>
        
        <div id="confirmSection" style="display: none;" class="text-center">
            <div class="alert alert-success">
                <i class="fas fa-check-circle fa-3x mb-2"></i>
                <h4>Payment Method: <strong id="selectedMethod"></strong></h4>
                <p>Total: ₹<span id="finalTotal">0</span></p>
            </div>
            <button class="btn-pay" onclick="completeOrder()">✅ Confirm & Place Order</button>
            <button class="btn btn-link mt-3" onclick="goBack()">← Change</button>
        </div>
    </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
